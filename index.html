<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<title>休暇のこり確認</title>
<style>
  body{font-family:-apple-system,sans-serif;margin:0;padding:16px;background:#f5f5f7;color:#1d1d1f;}
  h1{font-size:20px;margin:4px 0 12px;}
  .wrap{max-width:430px;margin:0 auto;}
  label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px;}
  select,input[type=date],input[type=number],input[type=password],input[type=text],textarea{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;}
  button{width:100%;padding:14px;font-size:16px;border:none;border-radius:8px;background:#0071e3;color:#fff;margin-top:16px;}
  button:disabled{background:#aaa;}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .updated{font-size:12px;color:#888;margin-bottom:10px;}
  .bal{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid #f0f0f0;}
  .bal:last-child{border-bottom:none;}
  .bal .n{font-weight:600;}
  .bal .v{font-size:22px;font-weight:700;color:#0071e3;}
  .bal .v small{font-size:13px;color:#888;font-weight:400;}
  .sub{font-size:12px;color:#666;}
  /* 「？」ヘルプ：指で押せる大きさを確保する */
  .help{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
        margin-left:6px;border:1px solid #c7c7cc;border-radius:50%;background:#fff;color:#0071e3;
        font-size:13px;font-weight:700;line-height:1;padding:0;vertical-align:middle;cursor:pointer;}
  .help:active{background:#eef4ff;}
  /* 説明モーダル */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;
       justify-content:center;z-index:50;}
  .sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:430px;max-height:82vh;
         overflow-y:auto;padding:18px 18px 28px;box-sizing:border-box;}
  .sheet h2{font-size:17px;margin:0 0 2px;}
  .sheet .kind{font-size:12px;color:#8a8a8e;margin-bottom:12px;}
  .sheet dt{font-size:12px;font-weight:700;color:#0071e3;margin-top:14px;}
  .sheet dd{margin:4px 0 0;font-size:14px;line-height:1.6;white-space:pre-line;}
  .sheet button{background:#eef0f3;color:#1d1d1f;}
  @media (min-width:520px){ .ovl{align-items:center;} .sheet{border-radius:16px;} }
  .pill{display:inline-block;background:#eef4ff;color:#0071e3;border-radius:14px;padding:3px 10px;font-size:12px;margin:0 6px 6px 0;}
  .warn{background:#fff3cd;color:#7a5c00;border:1px solid #ffe08a;padding:8px 10px;border-radius:8px;font-size:13px;margin-top:8px;}
  /* 自動更新が止まっているときだけ出す（古い数字を「動いている」と誤解させないため） */
  .stale{background:#ffe8e8;color:#b00;border:1px solid #f5b5b5;padding:10px;border-radius:8px;
         font-size:13px;font-weight:600;margin-bottom:10px;}
  .rec{font-size:13px;color:#444;padding:7px 0;border-bottom:1px dashed #eee;}
  .muted{color:#8a8a8e;font-size:12px;}
  .sect{font-size:13px;color:#8a8a8e;margin:2px 0 8px;font-weight:600;}
  .hint{font-size:12px;color:#8a8a8e;margin-top:4px;}
  .msg{padding:10px;border-radius:8px;margin-top:12px;font-size:14px;}
  .msg.err{background:#ffe8e8;color:#b00;}
  .msg.ok{background:#e8ffea;color:#070;}
  .hidden{display:none;}
  #pinCard{max-width:360px;margin:60px auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:right;padding:6px 4px;border-bottom:1px solid #eee;}
  th:first-child,td:first-child{text-align:left;}
</style>
</head>
<body>
<div class="wrap">

  <!-- PIN入力 -->
  <div class="card hidden" id="pinCard">
    <h1>休暇のこり確認</h1>
    <label>暗証番号（PIN）</label>
    <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" placeholder="配布された暗証番号を入力">
    <button id="pinBtn">はじめる</button>
    <div id="pinMsg"></div>
    <div class="muted" style="margin-top:10px;">※暗証番号は端末に保存しません。ログインは12時間で切れます。</div>
  </div>

  <!-- 休暇の説明（「？」で開く） -->
  <div class="ovl hidden" id="helpOvl">
    <div class="sheet">
      <h2 id="helpTitle"></h2>
      <div class="kind" id="helpKind"></div>
      <dl id="helpBody"></dl>
      <button id="helpClose">閉じる</button>
    </div>
  </div>

  <!-- 本体 -->
  <div id="app" class="hidden">
    <h1>休暇のこり確認 <span class="muted" id="who" style="float:right;font-weight:400;font-size:13px;margin-top:6px;"></span></h1>

    <div class="card" id="balCard">
      <div class="stale hidden" id="staleBox"></div>
      <div class="updated" id="updated"></div>
      <div id="balList"></div>
      <div id="pills" style="margin-top:12px;"></div>
      <div class="warn hidden" id="warnBox"></div>
      <div id="loadMsg"></div>
    </div>

    <div class="card hidden" id="formCard">
      <div class="sect">休暇を記録する</div>
      <div id="adminNameWrap" class="hidden">
        <label>職員（管理者の代理入力）</label>
        <select id="adminName"></select>
      </div>
      <label>取得日</label>
      <input type="date" id="date">
      <label>種別</label>
      <select id="kind"></select>
      <label>時間</label>
      <input type="number" id="hours" value="1" min="1" max="24" step="1" inputmode="numeric">
      <div class="hint" id="hoursHint">1時間単位で入力します（1日休む場合は勤務時間数、例：8）。</div>
      <label>メモ（任意）</label>
      <textarea id="memo" placeholder="例：通院のため" style="min-height:56px;" maxlength="200"></textarea>
      <button id="submitBtn">この内容で記録する</button>
      <div id="formMsg"></div>
      <div class="muted" style="margin-top:8px;">※記録は保存され、残り時間は次回の自動更新で反映されます。</div>
    </div>

    <div class="card hidden" id="recCard">
      <div class="sect">自分の直近の記録（閲覧のみ）</div>
      <div id="recList"></div>
      <div class="muted" style="margin-top:8px;">修正・削除が必要なときは管理者へ連絡してください。</div>
    </div>

    <!-- 管理者：全員の残数 -->
    <div class="card hidden" id="adminCard">
      <div class="sect">全員の残時間（管理者・閲覧）</div>
      <div style="overflow-x:auto;"><table id="adminTable"></table></div>
    </div>

    <div class="muted" style="text-align:center;"><a href="#" id="logoutBtn" style="color:#0071e3;text-decoration:none;">ログアウト</a></div>
  </div>

</div>

<script>
  // ▼ GASのWebアプリURL(/exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycbyTM93TAWPODL26QlqXPDqkw8FQym3LS6xSI_OJKgz56z13QTJBVW1Emt4m2lFDMRc/exec';

  var TOKEN_KEY = 'kyuka_token';
  var DEVICE_KEY = 'kyuka_device';

  function el(id){ return document.getElementById(id); }
  function show(id){ el(id).classList.remove('hidden'); }
  function hide(id){ el(id).classList.add('hidden'); }
  function msg(id, text, cls){ el(id).innerHTML = text ? '<div class="msg '+cls+'">'+esc(text)+'</div>' : ''; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var currentAdmin = false;   // 管理者モードか（代理入力の氏名必須判定に使う）
  var adminStaff = [];        // 管理者の代理入力用 [{name, job, refreshEligible}]
  // 全種別のマスター。サーバーが返す絞り込み済みリストで上書きしないこと
  // （上書きすると管理者の代理入力で リフレッシュ/養育 が選べなくなる）。
  var KINDS_ALL = ['有給','リフレッシュ','看護','養育','早退','遅刻','欠勤','特別'];

  // ── 休暇の説明（「？」で開く）──
  // 就業規則の内容をそのまま載せる。制度が変わったらここを直して再アップロードする。
  var HELP = {
    kango: {
      title: '子の看護等休暇',
      kind: '法律で定められた休暇（全員の権利）',
      body: [
        ['対象の子', '0歳 〜 小学校3年生修了まで（9歳の年度末）'],
        ['日数', '子1人 … 年5日\n子2人以上 … 年10日\n※年次有給休暇とは別枠\n※4月1日〜翌3月31日。翌年度への繰り越しはできません'],
        ['取得単位', '半日／1日\n※当社では時間単位での取得はできません'],
        ['使える目的', '① 病気・けがの看護\n② 予防接種・健康診断\n③ 感染症による学級閉鎖・出席停止\n④ 入園式・卒園式・入学式'],
      ],
    },
    youiku: {
      title: '養育両立支援休暇',
      kind: '会社の任意制度（柔軟な働き方措置①）',
      body: [
        ['対象の子', '3歳 〜 小学校就学前'],
        ['日数', '年10日（4月1日〜翌3月31日）\n※年次有給休暇とは別枠\n※翌年度への繰り越しはできません'],
        ['取得単位', '1日／時間単位\n（始業時刻から連続、または終業時刻まで連続して取得）'],
        ['使える目的', '子育てに関する幅広い目的\n（送迎・学校見学・保護者会・行事参加 など）\n※病気の看護は対象外です → 「子の看護休暇」をご利用ください'],
        ['給与', '取得した日数・時間に応じて控除されます（無給）\n昇給や退職金の計算には影響しません（通常勤務として扱います）'],
      ],
    },
  };

  function helpBtn(key){
    return '<button type="button" class="help" data-help="'+key+'" aria-label="この休暇の説明">?</button>';
  }

  function openHelp(key){
    var h = HELP[key];
    if(!h) return;
    el('helpTitle').textContent = h.title;
    el('helpKind').textContent = h.kind;
    el('helpBody').innerHTML = h.body.map(function(kv){
      return '<dt>'+esc(kv[0])+'</dt><dd>'+esc(kv[1])+'</dd>';
    }).join('');
    show('helpOvl');
  }

  // 残数は毎回描き直すので、個別ではなく親でクリックを受ける
  el('balList').addEventListener('click', function(ev){
    var btn = ev.target.closest ? ev.target.closest('.help') : null;
    if(btn) openHelp(btn.getAttribute('data-help'));
  });
  el('helpClose').onclick = function(){ hide('helpOvl'); };
  el('helpOvl').onclick = function(ev){ if(ev.target === el('helpOvl')) hide('helpOvl'); };

  // 対象外の種別を落とす（リフレッシュ＝看護師のみ／養育＝対象の子がいる人のみ）
  function kindsFor(refreshEligible, youikuEligible){
    return KINDS_ALL.filter(function(k){
      if(k === 'リフレッシュ') return !!refreshEligible;
      if(k === '養育') return !!youikuEligible;
      return true;
    });
  }

  // 旧版はPINそのものをlocalStorageに置いていた。残っていれば消す。
  try { localStorage.removeItem('kyuka_pin'); } catch(e){}

  // 端末を識別するID。これは「正規職員の打ち間違いで他の職員を巻き込まない」ための
  // 目印であって秘密ではない（サーバ側もそう扱う）。
  function deviceId(){
    var v = null;
    try { v = localStorage.getItem(DEVICE_KEY); } catch(e){}
    if(!v || !/^[A-Za-z0-9-]{8,64}$/.test(v)){
      v = 'd-' + Math.random().toString(36).slice(2) + '-' + Date.now().toString(36);
      v = v.replace(/[^A-Za-z0-9-]/g, '').slice(0, 64);
      try { localStorage.setItem(DEVICE_KEY, v); } catch(e){}
    }
    return v;
  }
  function getToken(){ try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e){ return ''; } }
  function setToken(t){ try { localStorage.setItem(TOKEN_KEY, t); } catch(e){} }
  function clearToken(){ try { localStorage.removeItem(TOKEN_KEY); } catch(e){} }

  // 端末のローカル日付（JST）。toISOString はUTC基準で前日になるため使わない。
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }

  async function post(body){
    var r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
    var j = await r.json();
    if(!j.ok){
      var err = new Error(j.error || 'APIエラー');
      err.authError = !!j.authError;   // 認証まわりはサーバが明示する（文言で判定しない）
      throw err;
    }
    return j.data;
  }

  function api(action, payload){
    return post({ action: action, token: getToken(), payload: payload || null });
  }

  function askPin(message){
    resetView();
    clearToken();
    hide('app'); show('pinCard');
    msg('pinMsg', message || '', 'err');
  }

  // 画面状態を初期化（管理者→職員の切替で前の描画が残らないように）
  // 管理者が代理入力する職員を切り替えたら、その職種で種別を絞り直す
  el('adminName').onchange = function(){
    var s = adminStaff[Number(el('adminName').value)];
    setKindOptions(s ? kindsFor(s.refreshEligible, s.youikuEligible) : KINDS_ALL);
  };

  function resetView(){
    currentAdmin = false;
    adminStaff = [];
    hide('helpOvl');
    hide('adminCard'); hide('formCard'); hide('recCard');
    el('balList').innerHTML = ''; el('pills').innerHTML = '';
    el('adminTable').innerHTML = ''; el('recList').innerHTML = '';
    el('who').textContent = ''; el('updated').textContent = '';
    hide('warnBox'); hide('adminNameWrap'); hide('staleBox');
    msg('loadMsg','',''); msg('formMsg','','');
  }

  el('pinBtn').onclick = function(){
    var v = el('pinInput').value.trim();
    if(!v){ msg('pinMsg','暗証番号を入力してください','err'); return; }
    el('pinBtn').disabled = true;
    // PINはこの1回だけ送り、端末には保存しない。以降はトークンで通す。
    post({ action:'login', pin: v, deviceId: deviceId() }).then(function(d){
      el('pinInput').value = '';
      el('pinBtn').disabled = false;
      setToken(d.token);
      msg('pinMsg','',''); hide('pinCard'); show('app'); load();
    }).catch(function(e){
      el('pinBtn').disabled = false;
      msg('pinMsg', e.message, 'err');
    });
  };

  el('logoutBtn').onclick = function(e){
    e.preventDefault();
    // サーバ側のトークンも破棄する（端末から消すだけにしない）
    api('logout').catch(function(){}).then(function(){ askPin(''); });
  };

  // 種別の選択肢を差し替える（リフレッシュは看護師のみ）
  function setKindOptions(kinds){
    var cur = el('kind').value;
    el('kind').innerHTML = (kinds||[]).map(function(k){ return '<option>'+esc(k)+'</option>'; }).join('');
    if(cur && kinds.indexOf(cur) !== -1) el('kind').value = cur;
    updateHoursHint();
  }

  // 種別ごとに取得単位が違う。子の看護等休暇は当社では半日／1日のみ（時間単位は不可）。
  var HINT_DEFAULT = '1時間単位で入力します（1日休む場合は勤務時間数、例：8）。';
  var HINT_BY_KIND = {
    '看護': '子の看護等休暇は半日または1日単位です。半日なら所定労働時間の半分、1日なら所定労働時間数を入力してください（時間単位での取得はできません）。'
  };
  function updateHoursHint(){
    el('hoursHint').textContent = HINT_BY_KIND[el('kind').value] || HINT_DEFAULT;
  }
  el('kind').onchange = updateHoursHint;

  function normJob(v){
    var t = String(v==null?'':v).replace(/\s+/g,'');
    if(t.indexOf('看護')!==-1) return '看護師';
    if(t.indexOf('リハ')!==-1) return 'リハビリ';
    if(t.indexOf('事務')!==-1) return '事務員';
    return '';
  }

  // 残数は3時間ごとの自動更新で作られる。止まると古い数字が出続けて「動いている」ように見えるので、
  // バナーの生成日が古いときだけはっきり知らせる。
  function checkStale(banner){
    var m = /生成:(\d{4})-(\d{2})-(\d{2})/.exec(String(banner||''));
    if(!m){ hide('staleBox'); return; }
    var gen = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.round((today - gen) / 86400000);
    if(days >= 2){
      el('staleBox').textContent = '⚠ 自動更新が止まっている可能性があります（最終更新 '
        + m[2] + '/' + m[3] + '・' + days + '日前）。表示中の残り時間は古いままです。管理者へご連絡ください。';
      show('staleBox');
    } else {
      hide('staleBox');
    }
  }

  function render(d){
    resetView();
    setKindOptions(d.kinds || KINDS_ALL);
    el('updated').textContent = d.updated || '';
    checkStale(d.updated);
    el('date').value = todayStr();
    if(d.admin){ renderAdmin(d); } else { renderStaff(d); }
  }

  function load(){
    resetView();
    el('balList').innerHTML = '<div class="muted">読み込み中…</div>';
    el('date').value = todayStr();
    api('me').then(render).catch(function(e){
      if(e.authError){ askPin(e.message); }
      else { el('balList').innerHTML = ''; msg('loadMsg','読み込みに失敗: '+e.message,'err'); }
    });
  }

  function renderStaff(d){
    currentAdmin = false;
    el('who').textContent = (d.name||'')+' さん'+(d.job ? '（'+d.job+'）' : '');
    show('formCard'); show('recCard');
    var b = d.balance;
    if(!b){
      el('balList').innerHTML = '<div class="muted">まだ集計されていません（管理者の自動更新後に表示されます）。</div>';
    } else {
      // リフレッシュ休暇は看護師のみ。対象外の職種には数字ではなく「対象外」と出す。
      var refreshCell = d.refreshEligible
        ? '<div class="v">'+esc(b['リフレッシュ_残(時間)'])+'<small> 時間</small></div>'
        : '<div class="sub" style="text-align:right;">対象外<br>（看護師のみ）</div>';
      // 養育両立支援休暇は対象の子（3歳〜就学前）がいる人だけ
      var youikuCell = Number(b['養育_対象子数']||0) > 0
        ? '<div class="v">'+esc(b['養育_残(時間)'])+'<small> 時間</small></div>'
        : '<div class="sub" style="text-align:right;">対象外<br>（3歳〜就学前の子）</div>';
      el('balList').innerHTML =
        '<div class="bal"><div><div class="n">有給休暇</div><div class="sub">次回付与 '+esc(b['有給_次回付与日']||'-')
          + (Number(b['有給_時効間近(時間)'])>0 ? '　/　まもなく時効 '+esc(b['有給_時効間近(時間)'])+'時間' : '') +'</div></div>'
          + '<div class="v">'+esc(b['有給_残(時間)'])+'<small> 時間</small></div></div>'
        + '<div class="bal"><div class="n">リフレッシュ休暇</div>'+refreshCell+'</div>'
        + '<div class="bal"><div><div class="n">子の看護休暇'+helpBtn('kango')+'</div><div class="sub">対象の子 '+esc(b['看護_対象子数'])+'人</div></div>'
          + '<div class="v">'+esc(b['看護_残(時間)'])+'<small> 時間</small></div></div>'
        + '<div class="bal"><div><div class="n">養育両立支援休暇'+helpBtn('youiku')+'</div><div class="sub">対象の子 '+esc(b['養育_対象子数']||0)+'人</div></div>'
          + youikuCell+'</div>';
      el('pills').innerHTML = '<div class="sect">今年度の記録（参考）</div>'
        + '<span class="pill">早退 '+esc(b['早退_回数'])+'回・'+esc(b['早退_時間'])+'時間</span>'
        + '<span class="pill">遅刻 '+esc(b['遅刻_回数'])+'回・'+esc(b['遅刻_時間'])+'時間</span>'
        + '<span class="pill">欠勤 '+esc(b['欠勤_回数'])+'回・'+esc(b['欠勤_時間'])+'時間</span>'
        + '<span class="pill">特別 '+esc(b['特別_時間'])+'時間</span>';
      if(b['警告']){ el('warnBox').textContent = '⚠ '+b['警告']; show('warnBox'); }
    }
    renderRecords(d.records||[]);
  }

  function renderRecords(rows){
    el('recList').innerHTML = rows.length ? rows.map(function(r){
      return '<div class="rec">'+esc(r.date)+'　'+esc(r.kind)+'　'+esc(r.hours)+'時間'+(r.memo?'　'+esc(r.memo):'')+'</div>';
    }).join('') : '<div class="muted">まだ記録がありません。</div>';
  }

  function renderAdmin(d){
    currentAdmin = true;
    el('who').textContent = '管理者';
    show('adminCard'); show('formCard'); show('adminNameWrap');
    el('balList').innerHTML = '';
    // 代理入力の職員は職員マスタの在籍者から選ぶ（打ち間違いによる不一致を防ぐ）
    adminStaff = d.staffList || [];
    el('adminName').innerHTML = '<option value="">— 職員を選んでください —</option>'
      + adminStaff.map(function(s, i){
          return '<option value="'+i+'">'+esc(s.name)+(s.job ? '（'+esc(s.job)+'）' : '')+'</option>';
        }).join('');
    setKindOptions(KINDS_ALL);   // 職員未選択のうちは全種別（選ぶと絞り込む）
    var rows = d.all||[];
    var head = '<tr><th>氏名</th><th>職種</th><th>有給</th><th>リフレ</th><th>看護</th><th>養育</th><th></th></tr>';
    var body = rows.map(function(b){
      // 対象外の休暇は数字ではなく「−」で分かるようにする
      var ref = (normJob(b.job) === '看護師') ? esc(b.refresh)+'h' : '−';
      var you = b.youikuEligible ? esc(b.youiku)+'h' : '−';
      return '<tr><td>'+esc(b.name)+'</td><td>'+esc(b.job||'未設定')+'</td><td>'+esc(b.yukyu)
        +'h</td><td>'+ref+'</td><td>'+esc(b.nursing)+'h</td><td>'+you+'</td><td>'+(b.warn?'⚠':'')+'</td></tr>';
    }).join('');
    el('adminTable').innerHTML = head + (body || '<tr><td colspan="7">まだ集計されていません</td></tr>');
  }

  el('submitBtn').onclick = function(){
    msg('formMsg','','');
    var hours = Number(el('hours').value);
    if(!isFinite(hours) || hours <= 0 || hours !== Math.round(hours)){
      msg('formMsg','時間は1時間単位の整数で入力してください','err'); return;
    }
    if(hours > 24){ msg('formMsg','1件あたり24時間までです（分けて記録してください）','err'); return; }
    if(!el('date').value){ msg('formMsg','取得日を選んでください','err'); return; }
    var payload = { dateStr: el('date').value, kind: el('kind').value, hours: hours, memo: el('memo').value };
    if(currentAdmin){
      var idx = el('adminName').value;
      if(idx === '' || !adminStaff[Number(idx)]){
        msg('formMsg','記録する職員を選んでください','err'); return;
      }
      payload.name = adminStaff[Number(idx)].name;
    }

    el('submitBtn').disabled = true;
    api('submit', payload).then(function(){
      el('memo').value=''; el('hours').value='1';
      el('submitBtn').disabled = false;
      // 保存は成功済み。以降の再読込が失敗しても「記録に失敗」とは出さない。
      api('me').then(function(d){
        render(d);
        msg('formMsg','記録しました。残り時間は次回の自動更新で反映されます。','ok');
      }).catch(function(){
        msg('formMsg','記録しました。（画面の再読み込みに失敗しました）','ok');
      });
    }).catch(function(e){
      el('submitBtn').disabled = false;
      if(e.authError){ askPin(e.message); }
      else msg('formMsg','記録に失敗: '+e.message,'err');
    });
  };

  // 起動
  if(getToken()){ show('app'); load(); } else askPin('');
</script>
</body>
</html>
